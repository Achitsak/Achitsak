<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Masterp — developer of Masterp Manager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0f11"/>
      <stop offset="1" stop-color="#15151c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#8b93ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8b93ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.95" cy="1" r="0.6">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ededf0"/>
      <stop offset="1" stop-color="#b8bcff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b93ff"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>
  <rect width="1280" height="360" fill="url(#glow2)"/>

  <!-- left: intro -->
  <g font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif">
    <text x="80" y="118" font-size="22" font-weight="600" fill="#a1a1aa" letter-spacing="2">HI, I'M</text>
    <text x="76" y="196" font-size="80" font-weight="800" fill="url(#title)" letter-spacing="-2">Masterp</text>
    <rect x="80" y="216" width="72" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="80" y="262" font-size="24" fill="#a1a1aa">Developer · Roblox automation · Tools that run 24/7</text>
  </g>

  <!-- right: code card -->
  <g transform="translate(790 60)" filter="url(#soft)">
    <rect width="410" height="240" rx="16" fill="#18181b" stroke="#2a2a30"/>
    <circle cx="22" cy="22" r="5" fill="#f87171"/>
    <circle cx="40" cy="22" r="5" fill="#facc15"/>
    <circle cx="58" cy="22" r="5" fill="#4ade80"/>
    <text x="390" y="27" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#71717a">masterp.lua</text>
    <line x1="0" y1="44" x2="410" y2="44" stroke="#2a2a30"/>

    <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="16">
      <text x="24" y="84"><tspan fill="#c792ea">local</tspan><tspan fill="#ededf0" dx="9">masterp = {</tspan></text>
      <text y="116"><tspan x="56" fill="#ededf0">building</tspan><tspan x="148" fill="#ededf0">=</tspan><tspan x="166" fill="#a7f3c4">"Masterp Manager"</tspan><tspan fill="#ededf0">,</tspan></text>
      <text y="148"><tspan x="56" fill="#ededf0">stack</tspan><tspan x="148" fill="#ededf0">=</tspan><tspan x="166" fill="#ededf0">{</tspan><tspan fill="#a7f3c4" dx="9">"Python"</tspan><tspan fill="#ededf0">,</tspan><tspan fill="#a7f3c4" dx="9">"Lua"</tspan><tspan fill="#ededf0" dx="9">},</tspan></text>
      <text y="180"><tspan x="56" fill="#ededf0">site</tspan><tspan x="148" fill="#ededf0">=</tspan><tspan x="166" fill="#a7f3c4">"masterpx.xyz"</tspan><tspan fill="#ededf0">,</tspan></text>
      <text x="24" y="212" fill="#ededf0">}</text>
    </g>
  </g>
</svg>
